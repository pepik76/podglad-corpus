label.chk{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 12px;border:2px solid var(--line);border-radius:10px;font-weight:700;font-size:15px;background:#fff;cursor:pointer}

#loader{position:fixed;inset:0;z-index:20;background:rgba(255,255,255,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;font-weight:700;font-size:21px}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<script>
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbzY18pXZ-kn3yCLjsI83moxk-uLzvaxaJWwwqrbpNPmqtm02PIwPLxXCYVKEhSa4HLqNQ/exec';
const S=0.001, $=id=>document.getElementById(id);

let anim=null,cubeRen,cubeScene,cubeCam,cubeZones=[],cubeHover=null;
let labEls=[],dimGroup=null,dimGroups=[];
let scene,cam,ren,ctl,group,boards=[];
let mode='project', activeCab=-1;
let sel=-1, selSet=new Set(), selLevel='board', listCab=-2, xray=false;
let center=null, radius=1, lastTry=null, docName='';
let dirty=true, exVal=0, viewW=1, viewH=1, edgeMats=null, wallHatchTex=null;
const geoCache=new Map(), matCache=new Map();
const need=()=>{dirty=true};

function makeWallHatchTexture(){
  const c=document.createElement('canvas');
  c.width=c.height=64;
  const x=c.getContext('2d');
  x.fillStyle='#ffffff';
  x.fillRect(0,0,64,64);
  x.strokeStyle='rgba(30,41,59,0.34)';
  x.lineWidth=2;
  for(let k=-64;k<=128;k+=8){
    x.beginPath();
    x.moveTo(k,0);
    x.lineTo(k+64,64);
    x.stroke();
  }
  const tex=new THREE.CanvasTexture(c);
  tex.wrapS=tex.wrapT=THREE.RepeatWrapping;
  tex.repeat.set(3,3);
  return tex;
}

function parseCurvePoints(krData){
  if(!krData||krData.indexOf('PTX=')<0)return [];
  const match=krData.match(/CURVE=-1\b([\s\S]*?)(?:,CURVE=|$)/);
  const seg=match?match[1]:krData;
  const parts=seg.split(',');
  const pts=[];
  let cur=null;

  for(let i=0;i<parts.length;i++){
    const item=parts[i].replace(/^"+|"+$/g,'');
    if(item.startsWith('PTOCKA=')){
      cur={x:0,z:0,style:0,arcR:0};
      pts.push(cur);
    }else if(!cur){
      continue;
    }else if(item.startsWith('PTX=')){
      cur.x=num(item.slice(4))*1000;
    }else if(item.startsWith('PTZ=')){
      cur.z=num(item.slice(4))*1000;
    }else if(item.startsWith('PTSTYLE=')){
      cur.style=Math.round(num(item.slice(8)));
    }else if(item.startsWith('PTARRA=')){
      cur.arcR=num(item.slice(7))*1000;
    }
  }
  return pts.filter(p=>Number.isFinite(p.x)&&Number.isFinite(p.z));
}

function appendShapeSegment(shape,prev,curr,scaleX,scaleY,minX,minZ,offX,offZ){
  const x1=((prev.x-minX)*scaleX-offX)*S;
  const y1=((prev.z-minZ)*scaleY-offZ)*S;
  const x2=((curr.x-minX)*scaleX-offX)*S;
  const y2=((curr.z-minZ)*scaleY-offZ)*S;
  const rMm=prev.arcR*Math.min(scaleX,scaleY);
  const chordMm=Math.hypot((curr.x-prev.x)*scaleX,(curr.z-prev.z)*scaleY);
  if(prev.style===2&&rMm>0.05&&chordMm>0.05){
    const r=Math.max(rMm,chordMm/2+0.01);
    const mx=(x1+x2)/2, my=(y1+y2)/2;
    const dx=x2-x1, dy=y2-y1;
    const len=Math.hypot(dx,dy);
    const h=Math.sqrt(Math.max(0,r*r-(chordMm*S/2)*(chordMm*S/2)));
    const cx=mx+(-dy/len)*h;
    const cy=my+(dx/len)*h;
    shape.quadraticCurveTo(cx,cy,x2,y2);
  }else{
    shape.lineTo(x2,y2);
  }
}

function makeHandleProfileGeometry(d){
  const isHandle=/truckicaelement|profil.*zobal|zobal.*profil/i.test((d.eclas||'')+' '+(d.parent||'')+' '+(d.name||''));
  if(!isHandle||!d.curveData)return null;
  const pts=parseCurvePoints(d.curveData);
  if(pts.length<3)return null;

  let minX=Infinity,maxX=-Infinity,minZ=Infinity,maxZ=-Infinity;
  for(const p of pts){
    if(p.x<minX)minX=p.x;
    if(p.x>maxX)maxX=p.x;
    if(p.z<minZ)minZ=p.z;
    if(p.z>maxZ)maxZ=p.z;
  }
  const spanX=maxX-minX, spanZ=maxZ-minZ;
  if(spanX<0.5||spanZ<0.5)return null;

  const shape=new THREE.Shape();
  shape.moveTo((pts[0].x-minX-spanX/2)*S,(pts[0].z-minZ-spanZ/2)*S);
  for(let i=1;i<pts.length;i++){
    appendShapeSegment(shape,pts[i-1],pts[i],1,1,minX,minZ,spanX/2,spanZ/2);
  }
  shape.closePath();

  const lenMm=Math.max(num(d.lenMm),...d.s,10);
  const geo=new THREE.ExtrudeGeometry(shape,{
    depth:lenMm*S,
    bevelEnabled:false,
    curveSegments:12
  });
  geo.translate(0,0,-(lenMm*S)/2);
  if(d.sm===0){
    geo.rotateY(Math.PI/2);
  }else if(d.sm===1){
    geo.rotateX(-Math.PI/2);
  }else{
    geo.rotateX(Math.PI/2);
  }
  geo.computeBoundingBox();
  return geo;
}

function hasCutout(pts){
  if(pts.length<5)return false;
  let minX=Infinity,maxX=-Infinity,minZ=Infinity,maxZ=-Infinity;
  for(const p of pts){
    if(p.x<minX)minX=p.x;
    if(p.x>maxX)maxX=p.x;
    if(p.z<minZ)minZ=p.z;
    if(p.z>maxZ)maxZ=p.z;
  }
  const spanX=maxX-minX, spanZ=maxZ-minZ;
  if(spanX<10||spanZ<10)return false;
  const tol=1.5;
  for(const p of pts){
    const onEdgeX=Math.abs(p.x-minX)<=tol||Math.abs(p.x-maxX)<=tol;
    const onEdgeZ=Math.abs(p.z-minZ)<=tol||Math.abs(p.z-maxZ)<=tol;
    if(!onEdgeX&&!onEdgeZ)return true;
  }
  return false;
}

function makeCutoutGeometry(d){
  if(d.shape==='cyl'||!d.curveData||d.sm!==0)return null;
  const pts=parseCurvePoints(d.curveData);
  if(!hasCutout(pts))return null;

  let minX=Infinity,maxX=-Infinity,minZ=Infinity,maxZ=-Infinity;
  for(const p of pts){
    if(p.x<minX)minX=p.x;
    if(p.x>maxX)maxX=p.x;
    if(p.z<minZ)minZ=p.z;
    if(p.z>maxZ)maxZ=p.z;
  }
  const spanX=Math.max(maxX-minX,1), spanZ=Math.max(maxZ-minZ,1);
  const H=d.s[1], D=d.s[2], T=d.s[0];
  const sx=H/spanX, sz=D/spanZ;

  const shape=new THREE.Shape();
  shape.moveTo(((pts[0].x-minX)*sx-H/2)*S,((pts[0].z-minZ)*sz-D/2)*S);
  for(let i=1;i<pts.length;i++){
    appendShapeSegment(shape,pts[i-1],pts[i],sx,sz,minX,minZ,H/2,D/2);
  }
  shape.closePath();

  const geo=new THREE.ExtrudeGeometry(shape,{
    depth:T*S,
    bevelEnabled:false,
    curveSegments:10
  });
  geo.translate(0,0,-(T*S)/2);
  geo.rotateY(Math.PI/2);
  geo.computeBoundingBox();
  return geo;
}

function geoFor(d,withEdges){
  const key=d.shape==='cyl'
    ?'c'+d.s[0]+'_'+d.s[1]
    :'b'+d.s.join('_')+'_'+(d.lenMm||0)+'_'+(d.eclas||'')+(d.curveData?'_k'+d.curveData.length:'');
  let g=geoCache.get(key);
  if(!g){
    const geo=d.shape==='cyl'
      ?new THREE.CylinderGeometry(d.s[0]/2*S,d.s[0]/2*S,d.s[1]*S,24)
      :(makeHandleProfileGeometry(d)||makeCutoutGeometry(d)||new THREE.BoxGeometry(d.s[0]*S,d.s[1]*S,d.s[2]*S));
    g={geo,edges:withEdges?new THREE.EdgesGeometry(geo,28):null};
    geoCache.set(key,g);
  }else if(withEdges&&!g.edges){
    g.edges=new THREE.EdgesGeometry(g.geo,28);
  }
  return g;
}
function matFor(col,st,isWall){
  const k=st==='s'?'s':col+'_'+st+(isWall?'_w':'');
  let m=matCache.get(k);
  if(m)return m;
  m=new THREE.MeshLambertMaterial({
    color:st==='s'?0xffc400:col,
    map:st!=='s'&&isWall?wallHatchTex:null,
    side:THREE.DoubleSide,
    polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1
  });
  if(st==='x'){m.transparent=true;m.opacity=.22;m.depthWrite=false}
  matCache.set(k,m);
  return m;
}
function disposeScene(){
  while(group.children.length)group.remove(group.children[0]);
  geoCache.forEach(g=>{g.geo.dispose();if(g.edges)g.edges.dispose()});geoCache.clear();
  matCache.forEach(m=>m.dispose());matCache.clear();
}

function init(){
  center=new THREE.Vector3();
  wallHatchTex=makeWallHatchTexture();
  edgeMats={n:new THREE.LineBasicMaterial({color:0x10151a}),s:new THREE.LineBasicMaterial({color:0xd00000})};
  const v=$('view');
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0xeef1f4);
  cam=new THREE.PerspectiveCamera(40,1,.01,200);
  ren=new THREE.WebGLRenderer({antialias:true});
  ren.setPixelRatio(Math.min(devicePixelRatio,2));
  v.appendChild(ren.domElement);

  ctl=new THREE.OrbitControls(cam,ren.domElement);
  ctl.enableDamping=true;
  ctl.dampingFactor=.12;
  ctl.addEventListener('change',need);

  scene.add(new THREE.HemisphereLight(0xffffff,0x8a8f99,.88));
  const d=new THREE.DirectionalLight(0xffffff,.62);
  d.position.set(3,5,4);
  scene.add(d);

  group=new THREE.Group();
  scene.add(group);

  new ResizeObserver(resize).observe(v);
  resize();

  const dom=ren.domElement, ptrs=new Set();
  let p0=null;
  dom.addEventListener('pointerdown',e=>{
    ptrs.add(e.pointerId);
    if(ptrs.size>1||e.button!==0){p0=null;return}
    p0={x:e.clientX,y:e.clientY,t:Date.now()};
  });
  dom.addEventListener('pointerup',e=>{
    const ok=p0&&ptrs.size===1;
    ptrs.delete(e.pointerId);
    if(ok){
      const mv=Math.hypot(e.clientX-p0.x,e.clientY-p0.y);
      if(mv<7&&Date.now()-p0.t<600)pick(e);
    }
    p0=null;
  });
  dom.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);p0=null});
  ctl.addEventListener('start',()=>{anim=null});

  initCube();
  (function loop(){
    requestAnimationFrame(loop);
    if(anim){stepAnim();dirty=true}
    const moved=ctl.update();
    if(moved||dirty){
      dirty=false;
      ren.render(scene,cam);
      updateLabs();
      renderCube();
    }
  })();
}
function resize(){
  const v=$('view');
  const w=v.clientWidth,h=v.clientHeight;
  if(!w||!h)return;
  viewW=w;viewH=h;
  ren.setSize(w,h);
  cam.aspect=w/h;
  cam.updateProjectionMatrix();
  need();
}

function colorFor(b){
  if(b.wall)return 0xc7d0d8;
  const n=(b.name||'').toLowerCase(),p=(b.parent||'').toLowerCase();
  if(/uchwyt|profil/.test(p+n))return 0x8d98a5;
  if(b.fr)return 0x5b8fd9;
  if(b.shape==='cyl'||/nozka|nóżk|stopk|axilo/.test(p+n))return 0x2b2f33;
  if(/front|drzw|czo[lł]o|fr_/.test(n))return 0x5b8fd9;
  if(/plecy|hdf|back/.test(n))return 0xa7a398;
  if(/p[oó][lł]k|shelf/.test(n))return 0xe3c48b;
  return 0xd6a96a;
}

function build(list,label){
  clearLabs();
  disposeScene();
  boards=[];
  mode='project';
  activeCab=-1;
  clearSel();
  listCab=-2;

  const withEdges=list.length<=250;

  list.forEach((d,i)=>{
    const M=new THREE.Matrix4();
    if(d.M)M.fromArray(d.M);

    const col=colorFor(d);
    const g=geoFor(d,withEdges);
    const m=new THREE.Mesh(g.geo,matFor(col,'n',!!d.wall));
    const c=new THREE.Vector3(d.m[0]+d.s[0]/2,d.m[1]+d.s[1]/2,d.m[2]+d.s[2]/2)
      .applyMatrix4(M)
      .multiplyScalar(S);
    m.position.copy(c);
    m.quaternion.setFromRotationMatrix(M);
    m.userData.i=i;

    let e=null;
    if(g.edges){
      e=new THREE.LineSegments(g.edges,edgeMats.n);
      m.add(e);
    }
    group.add(m);

    boards.push(Object.assign({},d,{mesh:m,edge:e,base:c.clone(),hidden:false,col,st:'n'}));
  });

  docName=label;
  $('ex').value=0;
  exVal=0;
  xray=false;
  $('bX').classList.remove('on');
  $('cFr').checked=false;
  $('cWa').checked=false;

  makeAnnotations(list.cabs&&list.cabs.length?list.cabs:[{name:label}]);
  syncModeUI();
  recalcBoundsAndCamera('iso',true);
  refresh();
}

const _bm=new THREE.Matrix4(), _one=new THREE.Vector3(1,1,1);
function boxOfBoard(b,exploded){
  const g=b.mesh.geometry;
  if(!g.boundingBox)g.computeBoundingBox();
  _bm.compose(exploded?b.mesh.position:b.base,b.mesh.quaternion,_one);
  return g.boundingBox.clone().applyMatrix4(_bm);
}

function visibleBoards(){
  return boards.filter(b=>b.mesh&&b.mesh.visible);
}

function recalcBoundsAndCamera(viewName='iso',instant=false){
  const visList=visibleBoards();
  const box=new THREE.Box3();
  (visList.length?visList:boards).forEach(b=>box.union(boxOfBoard(b,true)));
  if(!box.isEmpty()){
    box.getCenter(center);
    const sz=box.getSize(new THREE.Vector3());
    radius=Math.max(sz.length()/2,.12);
  }else{
    center.set(0,0,0);
    radius=1;
  }
  ctl.minDistance=radius*0.08;
  ctl.maxDistance=radius*25;
  if(instant)setView(viewName);
  else flyTo(dirForView(viewName));
}

function dirForView(n){
  const dirs={front:[0,0,1],back:[0,0,-1],left:[-1,0,0],right:[1,0,0],iso:[1,.8,1],reset:[1,.8,1]};
  return new THREE.Vector3(...(dirs[n]||dirs.iso)).normalize();

function flyTo(dv){
  dv=dv.clone().normalize();
  if(Math.abs(dv.y)>0.999){dv.z+=0.001;dv.normalize()}
  const dist=radius/Math.sin(THREE.MathUtils.degToRad(cam.fov/2))*1.05;
  cam.near=Math.max(dist/100,0.01);
  cam.far=Math.max(dist*100,100);
  cam.updateProjectionMatrix();
  const d0=Math.max(cam.position.distanceTo(ctl.target),0.05);
  const from=cam.position.clone().sub(ctl.target);
  if(from.lengthSq()<1e-9)from.set(1,.8,1);
  from.normalize();
  anim={
    t0:performance.now(),
    from,
    q:new THREE.Quaternion().setFromUnitVectors(from,dv),
    target0:ctl.target.clone(),
    target1:center.clone(),
    dist,
    d0
  };
  need();
}
const _qi=new THREE.Quaternion(), _qs=new THREE.Quaternion(), _dv=new THREE.Vector3();
function stepAnim(){
  if(!anim)return;
  const k=Math.min(1,(performance.now()-anim.t0)/350);
  const e=k*k*(3-2*k);
  _qs.copy(_qi.identity()).slerp(anim.q,e);
  _dv.copy(anim.from).applyQuaternion(_qs);
  ctl.target.lerpVectors(anim.target0,anim.target1,e);
  cam.position.copy(ctl.target).addScaledVector(_dv,anim.d0+(anim.dist-anim.d0)*e);
  if(k>=1)anim=null;
}

function initCube(){
  const box=$('cube'),N=112;
  cubeRen=new THREE.WebGLRenderer({antialias:true,alpha:true});
  cubeRen.setPixelRatio(Math.min(devicePixelRatio,2));
  cubeRen.setSize(N,N);
  box.appendChild(cubeRen.domElement);

  cubeScene=new THREE.Scene();
  cubeCam=new THREE.PerspectiveCamera(30,1,.1,30);
  const E=.2,L=1-2*E,base={1:0xf4f6f8,2:0xc9d0d8,3:0xa9b3be};

  for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++)for(let k=-1;k<=1;k++){
    if(!i&&!j&&!k)continue;
    const n=Math.abs(i)+Math.abs(j)+Math.abs(k);
    const g=new THREE.BoxGeometry(i?E:L,j?E:L,k?E:L);
    const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:base[n]}));
    m.position.set(i*(.5-E/2),j*(.5-E/2),k*(.5-E/2));
    m.userData={dir:new THREE.Vector3(i,j,k),base:base[n]};
    m.add(new THREE.LineSegments(new THREE.EdgesGeometry(g),new THREE.LineBasicMaterial({color:0x10151a})));
    cubeScene.add(m);
    cubeZones.push(m);
  }

  [['PRZÓD',[0,0,1]],['TYŁ',[0,0,-1]],['PRAWY',[1,0,0]],['LEWY',[-1,0,0]],['GÓRA',[0,1,0]],['DÓŁ',[0,-1,0]]].forEach(([t,n])=>{
    const c=document.createElement('canvas');
    c.width=c.height=128;
    const x=c.getContext('2d');
    x.fillStyle='#10151a';
    x.font='bold 30px Arial';
    x.textAlign='center';
    x.textBaseline='middle';
    x.fillText(t,64,66);
    const pl=new THREE.Mesh(
      new THREE.PlaneGeometry(L,L),
      new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthWrite:false})
    );
    const nv=v3(...n);
    pl.position.copy(nv).multiplyScalar(.503);
    pl.up.set(0,n[1]>0?0:(n[1]<0?0:1),n[1]>0?-1:(n[1]<0?1:0));
    pl.lookAt(nv.clone().multiplyScalar(2));
    pl.renderOrder=2;
    cubeScene.add(pl);
  });

  const rc=new THREE.Raycaster(),el=cubeRen.domElement;
  const hit=e=>{
    const r=el.getBoundingClientRect();
    rc.setFromCamera(new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1),cubeCam);
    const h=rc.intersectObjects(cubeZones,false)[0];
    return h&&h.object;
  };
  const setHover=o=>{
    if(cubeHover===o)return;
    if(cubeHover)cubeHover.material.color.setHex(cubeHover.userData.base);
    cubeHover=o;
    if(o)o.material.color.setHex(0xffc400);
    need();
  };
  el.addEventListener('pointermove',e=>setHover(hit(e)));
  el.addEventListener('pointerleave',()=>setHover(null));
  el.addEventListener('click',e=>{
    const o=hit(e);
    if(o&&boards.length)flyTo(o.userData.dir);
  });
}

function makeAnnotations(cl){
  const names={},seen={};
  cl.forEach(c=>names[c.name]=(names[c.name]||0)+1);
  cl.forEach((c,ci)=>{
    const A=new THREE.Box3(),B=new THREE.Box3();
    let any=false;
    boards.forEach(b=>{
      if((b.cab||0)!==ci||b.wall)return;
      const bx=boxOfBoard(b,false);
      A.union(bx);
      if(!(b.shape==='cyl'||/uchwyt/i.test(b.parent)))B.union(bx);
      any=true;
    });
    if(!any||B.isEmpty())return;
    const g=new THREE.Group();
    dimGroup.add(g);
    dimGroups[ci]=g;
    const off=Math.max(A.getSize(new THREE.Vector3()).length()*0.07,0.05),tk=off*0.18;
    const x0=B.min.x,x1=B.max.x,z0=B.min.z,z1=B.max.z,y0=A.min.y,y1=A.max.y;
    const nm=names[c.name]>1?c.name+' #'+(seen[c.name]=(seen[c.name]||0)+1):c.name;
    const nom=c.w&&c.h&&c.d?'\n'+Math.round(num(c.w))+' × '+Math.round(num(c.h))+' × '+Math.round(num(c.d))+' mm':'';
    addLab(nm+nom,v3((x0+x1)/2,y1+off*2.4,(z0+z1)/2),'cab',ci);
    dimLine(v3(x0,y1,z1),v3(x1,y1,z1),v3(x0,y1+off,z1),v3(x1,y1+off,z1),v3(0,1,0),tk,ci);
    dimLine(v3(x0,y0,z1),v3(x0,y1,z1),v3(x0-off,y0,z1),v3(x0-off,y1,z1),v3(1,0,0),tk,ci);
    dimLine(v3(x1,y0,z0),v3(x1,y0,z1),v3(x1+off,y0,z0),v3(x1+off,y0,z1),v3(0,1,0),tk,ci);
  });
}

  const hideFr=$('cFr').checked;
  const hideWa=$('cWa').checked;
  boards.forEach((b,i)=>{
    const inScope=mode==='project'||(b.cab||0)===activeCab;
    b.mesh.visible=inScope&&!b.hidden&&!(hideFr&&b.fr)&&!(hideWa&&b.wall);
    const s=selSet.has(i);

async function unpack(u8){
  let data=u8;

      const z=await JSZip.loadAsync(data);
      const names=Object.keys(z.files).filter(k=>!z.files[k].dir);
      data=await z.files[names.find(k=>/\.(s3d|xml)$/i.test(k))||names[0]].async('uint8array');
    }else if(data[0]===0x1f&&data[1]===0x8b){

    }else break;
  }

}
function num(v,d=0){

const unent=v=>v.indexOf('&')<0?v:v

  const o={},re=/([A-Za-z0-9_]+)\s*=\s*(?:"([^"]*)"|'([^']*)')/g;

function parseCorpus(text){
  const out=[],stack=[];
  out.cabs=[];
  let fid=0, lastAd=null;
  const elmClose=/<\/ELM\s*>/.test(text);
  const re=/<(\/?)(ELEMENT|ELM|AD|KRIVULJE|ELINKS|EFVK|SELBOX|POTROSNI|RUPE|DKOTE)(?=[\s\/>])((?:"[^"]*"|[^>"])*)>/g;
  const rad=Math.PI/180;
  let m;

  while((m=re.exec(text))){
    const close=m[1]==='/', tag=m[2], body=m[3], self=/\/\s*$/.test(body);

    if(tag==='ELINKS'||tag==='EFVK'||tag==='SELBOX'||tag==='POTROSNI'||tag==='RUPE'||tag==='DKOTE'){
      if(!close&&!self){
        const endTag='</'+tag+'>';
        const endIdx=text.indexOf(endTag,re.lastIndex);
        if(endIdx>=0)re.lastIndex=endIdx+endTag.length;
      }
      continue;
    }

    if(tag==='KRIVULJE'){
      if(!close&&lastAd&&!lastAd.curveData){
        const dm=body.match(/\bDATA\s*=\s*(?:"([^"]*)"|'([^']*)')/i);
        if(dm)lastAd.curveData=unent(dm[1]!==undefined?dm[1]:dm[2]);
      }
      continue;
    }

    if(tag==='ELEMENT'||tag==='ELM'){
      lastAd=null;
      if(tag==='ELM'&&!elmClose)continue;
      if(close){stack.pop();continue}
      const a=attrs(body), par=stack[stack.length-1];
      if(a.EVISIBLE==='false'){
        if(!self)stack.push({name:'',short:'',eclas:'',lenMm:0,M:par?par.M.clone():new THREE.Matrix4(),path:par?par.path:[],cab:par?par.cab:0,fr:false,wall:false,tp:'',skip:true});
        continue;
      }
      if(par&&par.skip){
        if(!self)stack.push({name:'',short:'',eclas:'',lenMm:0,M:par.M.clone(),path:par.path,cab:par.cab,fr:false,wall:false,tp:'',skip:true});
        continue;
      }
      const pk=q=>{for(const k in a)if(q.test(k))return num(a[k]);return 0};
      const T=new THREE.Matrix4().makeTranslation(pk(/^E?X(POS|POX)$/),pk(/^E?YPOS$/),pk(/^E?ZPOS$/));
      const R=new THREE.Matrix4().makeRotationFromEuler(
        new THREE.Euler(num(a.EXKUT)*rad,num(a.EKUT)*rad,num(a.EZKUT)*rad,'YXZ')
      );
      const M=(par?par.M.clone():new THREE.Matrix4()).multiply(T).multiply(R);
      const nm=a.ENAME||a.NAME||a.ELNAME||(tag==='ELM'?'ELM':'Element');
      const isWall=!!((par&&par.wall)||isWallTag(a));
      if(!par)out.cabs.push({name:nm,w:a.ESIRINA,h:a.EVISINA,d:a.EDUBINA});
      const f={
        name:(par?par.name+' / ':'')+nm,
        short:nm,
        eclas:a.ECLAS||'',
        lenMm:num(a.ESIRINA,0),
        M,
        path:[...(par?par.path:[]),++fid],
        cab:par?par.cab:out.cabs.length-1,
        fr:!!((par&&par.fr)||/fronta/i.test(a.ECLAS||'')||a.ETIPE==='7'),
        wall:isWall,
        tp:a.ETIPE||'',
        skip:false
      };
      if(tag==='ELM'&&(a.ETIPE==='16'||/nozka|nóżk/i.test(nm))){
        const r=25,h=num(a.EVISINA,100);
        out.push({
          name:nm,parent:par?par.name:'',mat:'Nóżka',shape:'cyl',wall:isWall,
          path:f.path,cab:f.cab,m:[-r,0,-r],s:[2*r,h,2*r],M:M.toArray()
        });
      }
      if(!self)stack.push(f);
    }else if(tag==='AD'){
      if(close){lastAd=null;continue}
      const a=attrs(body);
      if(a.VISIBLE==='false'){lastAd=null;continue}
      const f=stack[stack.length-1]||{name:'(bez elementu)',short:'',eclas:'',lenMm:0,M:new THREE.Matrix4(),cab:0,fr:false,wall:false,tp:'',skip:false};
      if(f.skip){lastAd=null;continue}
      if(f.tp==='16'||/^makro/i.test(a.DNAME||'')){lastAd=null;continue}
      const T=num(a.DEBLJINA),H=num(a.VISINA),D=num(a.DUBINA),sm=Math.round(num(a.SMJER));
      let s,zFrontDepth=true;
      if(sm===1){s=[D,H,T];zFrontDepth=false}
      else if(sm===2){s=[H,T,D]}
      else s=[T,H,D];
      const x=num(a.DXPOS),y=num(a.DYPOS),z=num(a.DZPOS);
      const zmin=zFrontDepth?z-s[2]:z;
      if(Math.min(...s)<0.5){lastAd=null;continue}
      const item={
        name:(stack.length>1?f.short+': ':'')+(a.DNAME||'Formatka'),
        parent:f.name,
        eclas:f.eclas||'',
        lenMm:f.lenMm||0,
        mat:a.MATNAME||'',
        cab:f.cab,
        path:f.path,
        fr:!!(!f.wall&&(f.fr||(a.TIPFRONTE&&a.TIPFRONTE!=='0')||/^front$/i.test(a.DNAME||''))),
        wall:!!f.wall,
        m:[x,y,zmin],
        s,
        sm,
        curveData:'',
        M:f.M.toArray()
      };
      out.push(item);
      lastAd=self?null:item;
    }
  }
  return out;
}

const paint=()=>new Promise(r=>setTimeout(r,40));
function showLoader(txt,sub){
  const l=$('loader');
  l.classList.remove('err');
  l.hidden=false;
  $('ltxt').textContent=txt;
  $('lsub').textContent=sub||'';
  $('lbtn').hidden=true;
}
function hideLoader(){
  $('loader').hidden=true;
}
function showErr(msg,sub,retry){
  const l=$('loader');
  l.classList.add('err');
  l.hidden=false;
  $('ltxt').textContent=msg;
  $('lsub').textContent=sub||'';
  $('lbtn').hidden=false;
  $('lretry').hidden=!retry;
  lastTry=retry||null;
}

async function loadBytes(u8,name){
  showLoader('Przetwarzanie projektu…',name);
  await paint();
  try{
    const list=parseCorpus(decode(await unpack(u8)));
    if(!list.length){
      showErr('Nie znaleziono żadnych formatek w tym pliku.','Sprawdź zawartość pliku z programu Corpus.',null);
      return;
    }
    build(list,name);
    hideLoader();
  }catch(err){
    showErr('Nie udało się odczytać pliku projektu',err.message||String(err),null);
  }
}

async function loadById(id){
  if(!SCRIPT_URL||!SCRIPT_URL.trim()){
    showErr('Brak skonfigurowanego adresu skryptu Google','Uzupełnij adres skryptu w pliku podglądu.',null);
    return;
  }
  showLoader('Ładowanie projektu z Dysku Google…','Identyfikator pliku: '+id);
  const ac=new AbortController();
  const to=setTimeout(()=>ac.abort(),90000);
  try{
    const sep=SCRIPT_URL.includes('?')?'&':'?';
    const r=await fetch(SCRIPT_URL+sep+'id='+encodeURIComponent(id),{signal:ac.signal});
    if(!r.ok)throw new Error('serwer zwrócił status '+r.status);
    const j=await r.json();
    clearTimeout(to);
    if(j.error)throw new Error(j.error);
    if(!j.base64)throw new Error('odpowiedź skryptu nie zawiera danych base64');
    const bin=atob(j.base64);
    const u8=new Uint8Array(bin.length);
    for(let k=0;k<bin.length;k++)u8[k]=bin.charCodeAt(k);
    await loadBytes(u8,j.name||'projekt.s3d');
  }catch(err){
    clearTimeout(to);
    const reason=err.name==='AbortError'?'przekroczono czas oczekiwania':(err.message||String(err));
    showErr('Nie udało się pobrać pliku ze skryptu Google',reason,()=>loadById(id));
  }
}

$('lretry').onclick=()=>lastTry&&lastTry();
$('lclose').onclick=hideLoader;

const libsOk=typeof THREE!=='undefined'&&typeof THREE.OrbitControls!=='undefined'
  &&typeof JSZip!=='undefined'&&typeof pako!=='undefined';

if(!libsOk){
  showErr('Nie udało się załadować bibliotek podglądu','Sprawdź połączenie z internetem i odśwież stronę.',null);
}else{
  let ok=true;
  try{init()}catch(err){
    ok=false;
    showErr('Nie udało się uruchomić podglądu 3D',(err&&err.message)||String(err),null);
  }
  if(ok){
    $('bList').onclick=()=>$('list').classList.toggle('open');
    $('bEditCab').onclick=()=>enterCabinetEditor(currentCabIndex());
    $('bBackProj').onclick=()=>exitCabinetEditor();
    $('home').onclick=()=>boards.length&&recalcBoundsAndCamera('iso',false);

    document.querySelectorAll('[data-lv]').forEach(b=>{
      b.onclick=()=>{
        if(b.disabled)return;
        selLevel=b.dataset.lv;
        document.querySelectorAll('[data-lv]').forEach(x=>x.classList.toggle('on',x===b));
        clearSel();
        refresh();
      };
    });

    $('bHide').onclick=()=>{
      if(sel>=0&&selSet.size){
        selSet.forEach(i=>{boards[i].hidden=true});
        clearSel();
        refresh();
      }
    };
    $('bX').onclick=()=>{
      xray=!xray;
      $('bX').classList.toggle('on',xray);
      refresh();
    };
    $('bAll').onclick=()=>{
      boards.forEach(b=>{
        if(mode==='project'||(b.cab||0)===activeCab)b.hidden=false;
      });
      xray=false;
      $('cFr').checked=false;
      $('cWa').checked=false;
      $('bX').classList.remove('on');
      refresh();
      recalcBoundsAndCamera('iso',false);
    };
    $('ex').oninput=applyExplode;
    $('cFr').onchange=()=>{
      if($('cFr').checked&&sel>=0&&boards[sel].fr)clearSel();
      refresh();
    };
    $('cWa').onchange=()=>{
      if($('cWa').checked&&sel>=0&&boards[sel].wall)clearSel();
      refresh();
    };

    const qid=new URLSearchParams(location.search).get('id');
    if(qid){
      loadById(qid);
    }else{
      showErr(
        'Brak parametru w adresie strony',
        'Otwórz podgląd z identyfikatorem pliku z Dysku Google.',
        null
      );
    }
  }
}
