<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Podgląd Corpus .s3d</title>
<style>
:root{--bg:#eef1f4;--ink:#10151a;--panel:#fff;--line:#10151a;--acc:#0a5cff;--hi:#ffc400}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);overflow:hidden}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;gap:8px;padding:8px;background:var(--panel);border-bottom:3px solid var(--line);flex-wrap:wrap;align-items:center}
button,.btn{font:inherit;font-weight:700;font-size:16px;min-height:48px;padding:0 14px;border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}
button:active,.btn:active{background:var(--hi)}
.on{background:var(--ink);color:#fff}
#title{flex:1;min-width:120px;font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis}
#stage{position:relative;flex:1;min-height:0}
#view{position:absolute;inset:0;touch-action:none}
#view canvas{display:block}
#info{position:absolute;left:8px;top:8px;right:136px;max-width:420px;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:8px 12px;font-size:16px;display:none}
#info b{font-size:18px}
#tools{background:var(--panel);border-top:3px solid var(--line);padding:6px 8px;display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;align-items:stretch;-webkit-overflow-scrolling:touch}
#tools section{flex:none;border:1.5px solid #b9c1ca;border-radius:12px;padding:3px 8px 7px;background:#f7f8fa}
#tools h5{margin:0 0 4px;font-size:12px;font-weight:700;color:#4a5560}
#tools .row{display:flex;gap:6px;align-items:center}
.seg{display:flex}.seg button{border-radius:0;margin-left:-2px}
.seg button:first-child{border-radius:10px 0 0 10px;margin-left:0}.seg button:last-child{border-radius:0 10px 10px 0}
#expl input{width:190px;flex:none}
#cubebox{position:absolute;top:8px;right:8px;width:112px;height:112px;z-index:4}
#cube canvas{width:112px;height:112px;display:block;cursor:pointer}
#home{position:absolute;left:-14px;top:-6px;width:38px;min-height:38px;padding:0;border-radius:19px;font-size:22px;line-height:1}
#tools .grp{display:flex;gap:6px;flex-wrap:wrap}
#expl{display:flex;align-items:center;gap:8px;font-weight:700;flex:1;min-width:220px}
#expl input{flex:1;height:40px;accent-color:var(--acc)}
#list{position:absolute;top:0;bottom:0;left:0;width:min(340px,88%);background:var(--panel);border-right:3px solid var(--line);overflow:auto;transform:translateX(-102%);transition:transform .2s;z-index:5}
#list.open{transform:none}
#list h4{margin:0;padding:10px 12px;background:var(--ink);color:#fff;font-size:15px;position:sticky;top:0}
#list button{width:100%;justify-content:flex-start;border-radius:0;border-width:0 0 1px;min-height:46px;font-weight:600;font-size:15px;text-align:left;white-space:normal}
#list button.sel{background:var(--hi)}
#list button.hid{opacity:.4;text-decoration:line-through}
#drop{position:absolute;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;text-align:center;padding:20px;cursor:pointer}
#drop h2{margin:0;font-size:26px}
body.drag #stage{outline:6px dashed var(--acc);outline-offset:-6px}
input[type=file]{display:none}
[hidden]{display:none!important}
.sg{padding:6px 12px;background:#e6eaee;font-weight:700;font-size:13px;border-bottom:1px solid #c3cad2}
label.chk{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 12px;border:2px solid var(--line);border-radius:10px;font-weight:700;font-size:16px;background:#fff;cursor:pointer}
label.chk input{width:24px;height:24px;accent-color:var(--acc)}
#labs{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lab{position:absolute;transform:translate(-50%,-50%);pointer-events:none;white-space:pre;text-align:center;font-weight:700;border-radius:6px;padding:3px 7px;display:none}
.lab.cab{background:#10151a;color:#fff;font-size:14px;line-height:1.25}
.lab.dim{background:#fff;color:#d00000;border:1.5px solid #d00000;font-size:13px;padding:1px 5px}
</style>
</head>
<body>
<div id="app">
 <header><div id="title">Brak projektu</div><button id="bList" hidden>Lista</button></header>
 <input id="f" type="file">
 <div id="stage">
  <div id="view"></div>
  <div id="labs"></div>
  <div id="cubebox"><div id="cube"></div><button id="home" title="Widok domyślny">⌂</button></div>
  <div id="info"></div>
  <aside id="list"></aside>
  <div id="drop"><h2>Przeciągnij tutaj plik .s3d</h2><div>albo dotknij, żeby go wybrać. Plik nie opuszcza Twojego urządzenia.</div></div>
 </div>
 <div id="tools">
  <section><h5>Zaznaczanie</h5><div class="row">
   <div class="seg"><button data-lv="board" class="on">Formatka</button><button data-lv="sub">Podzespół</button><button data-lv="cab">Szafka</button></div>
   <button id="bHide">Ukryj zaznaczony</button>
  </div></section>
  <section><h5>Widoczność</h5><div class="row">
   <label class="chk"><input type="checkbox" id="cFr">Ukryj fronty</label>
   <button id="bX">Przezroczystość</button><button id="bAll">Pokaż wszystko</button>
  </div></section>
  <section><h5>Opisy</h5><div class="row">
   <label class="chk"><input type="checkbox" id="cLab" checked>Ukryj etykiety</label>
   <label class="chk"><input type="checkbox" id="cDim" checked>Ukryj wymiary</label>
  </div></section>
  <section><h5>Rozstrzelenie</h5><div id="expl"><input id="ex" type="range" min="0" max="100" value="0"></div></section>
 </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<script>
const S=0.001, $=id=>document.getElementById(id);
let anim=null,cubeRen,cubeScene,cubeCam,cubeZones=[],cubeHover=null;
let labEls=[],dimGroup=null,dimGroups=[],curG=null,curCi=0;
let scene,cam,ren,ctl,group,boards=[],sel=-1,selSet=new Set(),selLevel='board',listCab=-2,xray=false,center=new THREE.Vector3(),radius=1;

/* ---------- 3D ---------- */
function init(){
  const v=$('view');
  scene=new THREE.Scene(); scene.background=new THREE.Color(0xeef1f4);
  cam=new THREE.PerspectiveCamera(40,1,.01,100);
  ren=new THREE.WebGLRenderer({antialias:true}); ren.setPixelRatio(Math.min(devicePixelRatio,2));
  v.appendChild(ren.domElement);
  ctl=new THREE.OrbitControls(cam,ren.domElement); ctl.enableDamping=true; ctl.dampingFactor=.12;
  scene.add(new THREE.HemisphereLight(0xffffff,0x8a8f99,.85));
  const d=new THREE.DirectionalLight(0xffffff,.6); d.position.set(3,5,4); scene.add(d);
  group=new THREE.Group(); scene.add(group);
  new ResizeObserver(resize).observe(v); resize();
  let p0=null;
  ren.domElement.addEventListener('pointerdown',e=>{p0={x:e.clientX,y:e.clientY,t:Date.now()}});
  ren.domElement.addEventListener('pointerup',e=>{
    if(!p0)return; const mv=Math.hypot(e.clientX-p0.x,e.clientY-p0.y); if(mv<7&&Date.now()-p0.t<600)pick(e); p0=null;
  });
  ctl.addEventListener('start',()=>{anim=null});initCube();
  (function loop(){requestAnimationFrame(loop);stepAnim();ctl.update();ren.render(scene,cam);updateLabs();renderCube()})();
}
function resize(){const v=$('view');const w=v.clientWidth,h=v.clientHeight;if(!w||!h)return;ren.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix()}

function colorFor(b){
  const n=(b.name||'').toLowerCase(),p=(b.parent||'').toLowerCase();
  if(/uchwyt/.test(p+n))return 0x8d98a5;
  if(b.fr)return 0x5b8fd9;
  if(b.shape==='cyl'||/nozka/.test(p+n))return 0x2b2f33;
  if(/front|drzw|czo[lł]o|fr_/.test(n))return 0x5b8fd9;
  if(/plecy|hdf|back/.test(n))return 0xa7a398;
  if(/p[oó][lł]k|shelf/.test(n))return 0xe3c48b;
  return 0xd6a96a;
}
function build(list,label){
  clearLabs();
  while(group.children.length)group.remove(group.children[0]);
  boards=[];sel=-1;selSet=new Set();
  list.forEach((d,i)=>{
    const g=d.shape==='cyl'?new THREE.CylinderGeometry(d.s[0]/2*S,d.s[0]/2*S,d.s[1]*S,24):new THREE.BoxGeometry(d.s[0]*S,d.s[1]*S,d.s[2]*S);
    const M=new THREE.Matrix4();if(d.M)M.fromArray(d.M);
    const mat=new THREE.MeshLambertMaterial({color:colorFor(d),polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1});
    const m=new THREE.Mesh(g,mat);
    const c=new THREE.Vector3(d.m[0]+d.s[0]/2,d.m[1]+d.s[1]/2,d.m[2]+d.s[2]/2).applyMatrix4(M).multiplyScalar(S);
    m.position.copy(c); m.quaternion.setFromRotationMatrix(M); m.userData.i=i;
    const e=new THREE.LineSegments(new THREE.EdgesGeometry(g,30),new THREE.LineBasicMaterial({color:0x10151a}));
    m.add(e); group.add(m);
    boards.push(Object.assign({},d,{mesh:m,edge:e,base:c.clone(),hidden:false,col:mat.color.getHex()}));
  });
  const bb=new THREE.Box3().setFromObject(group);
  bb.getCenter(center); radius=Math.max(bb.getSize(new THREE.Vector3()).length()/2,.1);
  $('ex').value=0; xray=false; $('bX').classList.remove('on');
  $('title').textContent=label+' — formatek: '+boards.length;
  $('drop').style.display='none';
  makeAnnotations(list.cabs&&list.cabs.length?list.cabs:[{name:label}]);
  setView('iso'); listCab=-2; refresh();
}
function flyTo(dv){
  dv=dv.clone().normalize();if(Math.abs(dv.y)>0.999){dv.z+=0.001;dv.normalize()}
  const dist=radius/Math.sin(THREE.MathUtils.degToRad(cam.fov/2))*1.05;
  const d0=cam.position.distanceTo(ctl.target),from=cam.position.clone().sub(ctl.target).normalize();
  anim={t0:performance.now(),from,q:new THREE.Quaternion().setFromUnitVectors(from,dv),dist,d0};
}
function stepAnim(){
  if(!anim)return;
  const k=Math.min(1,(performance.now()-anim.t0)/350),e=k*k*(3-2*k);
  const d=anim.from.clone().applyQuaternion(new THREE.Quaternion().slerp(anim.q,e));
  ctl.target.copy(center);cam.position.copy(center).addScaledVector(d,anim.d0+(anim.dist-anim.d0)*e);
  if(k>=1)anim=null;
}
function initCube(){
  const box=$('cube'),N=112;
  cubeRen=new THREE.WebGLRenderer({antialias:true,alpha:true});cubeRen.setPixelRatio(Math.min(devicePixelRatio,2));cubeRen.setSize(N,N);
  box.appendChild(cubeRen.domElement);
  cubeScene=new THREE.Scene();cubeCam=new THREE.PerspectiveCamera(30,1,.1,30);
  const E=.2,L=1-2*E,base={1:0xf4f6f8,2:0xc9d0d8,3:0xa9b3be};
  for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++)for(let k=-1;k<=1;k++){
    if(!i&&!j&&!k)continue;
    const n=Math.abs(i)+Math.abs(j)+Math.abs(k),g=new THREE.BoxGeometry(i?E:L,j?E:L,k?E:L);
    const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:base[n]}));
    m.position.set(i*(.5-E/2),j*(.5-E/2),k*(.5-E/2));
    m.userData={dir:new THREE.Vector3(i,j,k),base:base[n]};
    m.add(new THREE.LineSegments(new THREE.EdgesGeometry(g),new THREE.LineBasicMaterial({color:0x10151a})));
    cubeScene.add(m);cubeZones.push(m);
  }
  [['PRZÓD',[0,0,1]],['TYŁ',[0,0,-1]],['PRAWY',[1,0,0]],['LEWY',[-1,0,0]],['GÓRA',[0,1,0]],['DÓŁ',[0,-1,0]]].forEach(([t,n])=>{
    const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');
    x.fillStyle='#10151a';x.font='bold 30px Arial';x.textAlign='center';x.textBaseline='middle';x.fillText(t,64,66);
    const pl=new THREE.Mesh(new THREE.PlaneGeometry(L,L),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthWrite:false}));
    const nv=v3(...n);pl.position.copy(nv).multiplyScalar(.503);
    pl.up.set(0,n[1]>0?0:(n[1]<0?0:1),n[1]>0?-1:(n[1]<0?1:0));
    pl.lookAt(nv.clone().multiplyScalar(2));pl.renderOrder=2;cubeScene.add(pl);
  });
  const rc=new THREE.Raycaster(),el=cubeRen.domElement;
  const hit=e=>{const r=el.getBoundingClientRect();rc.setFromCamera(new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1),cubeCam);const h=rc.intersectObjects(cubeZones,false)[0];return h&&h.object};
  const setHover=o=>{if(cubeHover&&cubeHover!==o)cubeHover.material.color.setHex(cubeHover.userData.base);cubeHover=o;if(o)o.material.color.setHex(0xffc400)};
  el.addEventListener('pointermove',e=>setHover(hit(e)));
  el.addEventListener('pointerleave',()=>setHover(null));
  el.addEventListener('click',e=>{const o=hit(e);if(o&&boards.length)flyTo(o.userData.dir)});
}
function renderCube(){
  const d=cam.position.clone().sub(ctl.target);if(d.lengthSq()<1e-9)d.set(1,.8,1);
  cubeCam.position.copy(d.normalize().multiplyScalar(3.8));cubeCam.up.copy(cam.up);cubeCam.lookAt(0,0,0);
  cubeRen.render(cubeScene,cubeCam);
}
function setView(n){
  const dirs={front:[0,0,1],back:[0,0,-1],left:[-1,0,0],right:[1,0,0],iso:[1,.8,1],reset:[1,.8,1]};
  const dv=new THREE.Vector3(...dirs[n]).normalize();
  const dist=radius/Math.sin(THREE.MathUtils.degToRad(cam.fov/2))*1.05;
  cam.near=dist/100;cam.far=dist*100;cam.updateProjectionMatrix();
  cam.position.copy(center).addScaledVector(dv,dist); ctl.target.copy(center); ctl.update();
}
const v3=(x,y,z)=>new THREE.Vector3(x,y,z);
function clearLabs(){$('labs').innerHTML='';labEls=[];if(dimGroup)scene.remove(dimGroup);dimGroup=new THREE.Group();dimGroups=[];scene.add(dimGroup)}
function vis(ci,hide){return !hide||(sel>=0&&boards[sel]&&(boards[sel].cab||0)===ci)}
function addLab(text,pos,cls){const el=document.createElement('div');el.className='lab '+cls;el.textContent=text;$('labs').appendChild(el);labEls.push({el,pos,dim:cls==='dim',cab:curCi})}
function dimLine(ca,cb,a,b,perp,tk){
  const t=perp.clone().multiplyScalar(tk);
  const pts=[ca,a,cb,b,a,b,a.clone().add(t),a.clone().sub(t),b.clone().add(t),b.clone().sub(t)];
  const l=new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0xd00000,depthTest:false}));
  l.renderOrder=10;curG.add(l);
  addLab(String(Math.round(a.distanceTo(b)/S)),a.clone().add(b).multiplyScalar(.5),'dim');
}
function makeAnnotations(cl){
  const names={},seen={};cl.forEach(c=>names[c.name]=(names[c.name]||0)+1);
  cl.forEach((c,ci)=>{
    const A=new THREE.Box3(),B=new THREE.Box3();let any=false;
    boards.forEach(b=>{if((b.cab||0)!==ci)return;const bx=new THREE.Box3().setFromObject(b.mesh);A.union(bx);if(!(b.shape==='cyl'||/uchwyt/i.test(b.parent)))B.union(bx);any=true});
    if(!any||B.isEmpty())return;
    curCi=ci;curG=new THREE.Group();dimGroup.add(curG);dimGroups[ci]=curG;
    const off=Math.max(A.getSize(new THREE.Vector3()).length()*0.07,0.05),tk=off*0.18;
    const x0=B.min.x,x1=B.max.x,z0=B.min.z,z1=B.max.z,y0=A.min.y,y1=A.max.y;
    const nm=names[c.name]>1?c.name+' #'+(seen[c.name]=(seen[c.name]||0)+1):c.name;
    const nom=c.w&&c.h&&c.d?'\n'+Math.round(num(c.w))+' × '+Math.round(num(c.h))+' × '+Math.round(num(c.d))+' mm':'';
    addLab(nm+nom,v3((x0+x1)/2,y1+off*2.4,(z0+z1)/2),'cab');
    dimLine(v3(x0,y1,z1),v3(x1,y1,z1),v3(x0,y1+off,z1),v3(x1,y1+off,z1),v3(0,1,0),tk);
    dimLine(v3(x0,y0,z1),v3(x0,y1,z1),v3(x0-off,y0,z1),v3(x0-off,y1,z1),v3(1,0,0),tk);
    dimLine(v3(x1,y0,z0),v3(x1,y0,z1),v3(x1+off,y0,z0),v3(x1+off,y0,z1),v3(0,1,0),tk);
  });
}
function updateLabs(){
  const v=$('view'),w=v.clientWidth,h=v.clientHeight,exp=$('ex').value>0;
  labEls.forEach(l=>{
    const p=l.pos.clone().project(cam),show=p.z<1&&vis(l.cab,l.dim?$('cDim').checked:$('cLab').checked)&&!(l.dim&&exp);
    l.el.style.display=show?'block':'none';
    if(show){l.el.style.left=((p.x+1)/2*w)+'px';l.el.style.top=((1-p.y)/2*h)+'px'}
  });
}
function refresh(){
  const cs=sel>=0?(boards[sel].cab||0):-1;
  if(cs!==listCab)buildList();
  $('bList').hidden=cs<0;if(cs<0)$('list').classList.remove('open');
  dimGroups.forEach((g,ci)=>{if(g)g.visible=$('ex').value==0&&vis(ci,$('cDim').checked)});
  const k=$('ex').value/100*0.9;
  boards.forEach((b,i)=>{
    b.mesh.visible=!b.hidden&&!($('cFr').checked&&b.fr);
    b.mesh.position.copy(b.base).addScaledVector(b.base.clone().sub(center),k);
    const m=b.mesh.material,s=selSet.has(i);
    m.color.setHex(s?0xffc400:b.col);
    const t=xray&&!s; m.transparent=t; m.opacity=t?.22:1; m.depthWrite=!t; m.needsUpdate=true;
    b.edge.material.color.setHex(s?0xd00000:0x10151a);
  });
  document.querySelectorAll('#list button[data-i]').forEach(el=>{
    const i=+el.dataset.i; el.classList.toggle('sel',selSet.has(i)); el.classList.toggle('hid',!!(boards[i]&&(boards[i].hidden||($('cFr').checked&&boards[i].fr))));
  });
  const info=$('info');
  if(sel>=0&&selSet.size>1){
    const b=boards[sel],parts=b.parent.split(' / ');
    const nm=selLevel==='cab'?parts[0]:(parts[1]||parts[0]+' (korpus)');
    const bx=new THREE.Box3();selSet.forEach(i=>bx.union(new THREE.Box3().setFromObject(boards[i].mesh)));
    const z=bx.getSize(new THREE.Vector3()).multiplyScalar(1/S);
    info.style.display='block';
    info.innerHTML='<b></b><br>Zaznaczono formatek: '+selSet.size+'<br>Gabaryt: '+Math.round(z.x)+' × '+Math.round(z.y)+' × '+Math.round(z.z)+' mm<br>Szafka: <span></span>';
    info.querySelector('b').textContent=nm;info.querySelector('span').textContent=parts[0];
  } else if(sel>=0){
    const b=boards[sel],a=[...b.s].sort((x,y)=>y-x).map(v=>Math.round(v*10)/10);
    info.style.display='block';
    info.innerHTML='<b></b><br>Wymiary: '+a[0]+' × '+a[1]+' × '+a[2]+' mm<br>Element nadrzędny: <span></span>';
    info.querySelector('b').textContent=b.name; info.querySelector('span').textContent=b.parent;
  } else info.style.display='none';
}
function clearSel(){sel=-1;selSet=new Set()}
function groupOf(i){
  if(selLevel==='board')return [i];
  const P=k=>boards[k].path||[0],cab=k=>boards[k].cab||0,c=cab(i),pid=P(i)[1],ids=boards.map((_,k)=>k);
  if(selLevel==='cab')return ids.filter(k=>cab(k)===c);
  return ids.filter(k=>cab(k)===c&&(pid===undefined?P(k).length<2:P(k)[1]===pid));
}
function select(i){if(sel===i)clearSel();else{sel=i;selSet=new Set(groupOf(i))}refresh()}
function pick(e){
  const r=ren.domElement.getBoundingClientRect();
  const ndc=new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);
  const rc=new THREE.Raycaster();rc.setFromCamera(ndc,cam);
  const h=rc.intersectObjects(group.children.filter(o=>o.visible),false)[0];
  if(h)select(h.object.userData.i); else {clearSel();refresh()}
}
function isPart(b){return !(b.shape==='cyl'||/uchwyt|nozka|nóżk|stopk|axilo/i.test((b.parent||'')+' '+(b.name||'')))}
function buildList(){
  const l=$('list');l.innerHTML='';
  const c=sel>=0?(boards[sel].cab||0):-1;listCab=c;
  if(c<0)return;
  const idx=boards.map((_,i)=>i).filter(i=>(boards[i].cab||0)===c&&isPart(boards[i]));
  const h=document.createElement('h4');h.textContent=boards[sel].parent.split(' / ')[0]+' — formatek: '+idx.length;l.appendChild(h);
  const groups={};
  idx.forEach(i=>{const g=boards[i].parent.split(' / ').slice(1).join(' / ')||'Korpus';(groups[g]=groups[g]||[]).push(i)});
  const multi=Object.keys(groups).length>1;
  Object.keys(groups).forEach(g=>{
    if(multi){const d=document.createElement('div');d.className='sg';d.textContent=g;l.appendChild(d)}
    groups[g].forEach(i=>{
      const b=boards[i],el=document.createElement('button');el.dataset.i=i;
      const a=[...b.s].sort((x,y)=>y-x).map(v=>Math.round(v));
      el.textContent=b.name+'  ('+a.join('×')+')';
      el.onclick=()=>{sel=i;selSet=new Set([i]);refresh();if(innerWidth<700)l.classList.remove('open')};
      l.appendChild(el);
    });
  });
}

/* ---------- parser .s3d ---------- */
function decode(u){
  try{return new TextDecoder('utf-8',{fatal:true}).decode(u)}catch(e){return new TextDecoder('windows-1250').decode(u)}
}
async function unpack(u8){
  let data=u8;
  for(let n=0;n<5;n++){
    if(data[0]===0x50&&data[1]===0x4B){
      const z=await JSZip.loadAsync(data);
      const names=Object.keys(z.files).filter(k=>!z.files[k].dir);
      data=await z.files[names.find(k=>/\.(s3d|xml)$/i.test(k))||names[0]].async('uint8array');
    }else if(data[0]===0x1f&&data[1]===0x8b){data=pako.ungzip(data)}
    else if(data[0]===0x78&&[1,0x5e,0x9c,0xda].includes(data[1])){
      try{data=pako.inflate(data)}catch(e){break}
    }else break;
  }
  return data;
}
function num(v,d=0){if(v==null||v==='')return d;const x=parseFloat(String(v).replace(',','.'));return isNaN(x)?d:x}
function attrs(s){
  const o={},re=/([A-Za-z0-9_]+)="([^"]*)"/g;let m;
  while((m=re.exec(s)))o[m[1]]=m[2].replace(/&quot;/g,'"').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&');
  return o;
}
function parseCorpus(text){
  const out=[],stack=[];out.cabs=[];let fid=0;
  const elmClose=/<\/ELM\s*>/.test(text);
  const re=/<(\/?)(ELEMENT|ELM|AD)(?=[\s\/>])((?:"[^"]*"|[^>"])*)>/g;let m;
  const rad=Math.PI/180;
  while((m=re.exec(text))){
    const close=m[1]==='/',tag=m[2],body=m[3],self=/\/\s*$/.test(body);
    if(tag==='ELEMENT'||tag==='ELM'){
      if(tag==='ELM'&&!elmClose)continue;
      if(close){stack.pop();continue}
      const a=attrs(body),par=stack[stack.length-1];
      const pk=q=>{for(const k in a)if(q.test(k))return num(a[k]);return 0};
      const T=new THREE.Matrix4().makeTranslation(pk(/^E?X(POS|POX)$/),pk(/^E?YPOS$/),pk(/^E?ZPOS$/));
      const R=new THREE.Matrix4().makeRotationFromEuler(new THREE.Euler(num(a.EXKUT)*rad,num(a.EKUT)*rad,num(a.EZKUT)*rad,'YXZ'));
      const M=(par?par.M.clone():new THREE.Matrix4()).multiply(T).multiply(R);
      const nm=a.ENAME||a.NAME||a.ELNAME||(tag==='ELM'?'ELM':'Element');
      if(!par)out.cabs.push({name:nm,w:a.ESIRINA,h:a.EVISINA,d:a.EDUBINA});
      const f={name:(par?par.name+' / ':'')+nm,short:nm,M,path:[...(par?par.path:[]),++fid],cab:par?par.cab:out.cabs.length-1,fr:!!((par&&par.fr)||/fronta/i.test(a.ECLAS||'')||a.ETIPE==='7')};
      if(tag==='ELM'&&(a.ETIPE==='16'||/nozka/i.test(nm))){
        const r=25,h=num(a.EVISINA,100);
        out.push({name:nm,parent:par?par.name:'',smjer:-1,shape:'cyl',path:f.path,cab:f.cab,m:[-r,0,-r],s:[2*r,h,2*r],M:M.toArray()});
      }
      if(!self)stack.push(f);
    }else if(!close){
      const a=attrs(body),f=stack[stack.length-1]||{name:'(bez elementu)',short:'',M:new THREE.Matrix4(),cab:0};
      const T=num(a.DEBLJINA),H=num(a.VISINA),D=num(a.DUBINA),sm=Math.round(num(a.SMJER));
      let s,zFrontDepth=true;
      if(sm===1){s=[D,H,T];zFrontDepth=false}
      else if(sm===2){s=[H,T,D]}
      else s=[T,H,D];
      const x=num(a.DXPOS),y=num(a.DYPOS),z=num(a.DZPOS);
      const zmin=zFrontDepth?z-s[2]:z;
      if(Math.min(...s)<0.5)continue;
      out.push({name:(stack.length>1?f.short+': ':'')+(a.DNAME||'Formatka'),parent:f.name,cab:f.cab,path:f.path,fr:!!f.fr,smjer:sm,m:[x,y,zmin],s,M:f.M.toArray()});
    }
  }
  return out;
}
async function loadFile(f){
  try{
    const list=parseCorpus(decode(await unpack(new Uint8Array(await f.arrayBuffer()))));
    if(!list.length){alert('Nie znaleziono żadnych formatek w tym pliku.');return}
    build(list,f.name);
  }catch(err){alert('Nie udało się wczytać pliku: '+err.message)}
}

/* ---------- UI ---------- */
init();
$('f').onchange=e=>{if(e.target.files[0])loadFile(e.target.files[0]);e.target.value=''};
$('bList').onclick=()=>$('list').classList.toggle('open');
$('drop').onclick=()=>$('f').click();
$('home').onclick=()=>boards.length&&flyTo(v3(1,.8,1));
document.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{selLevel=b.dataset.lv;document.querySelectorAll('[data-lv]').forEach(x=>x.classList.toggle('on',x===b));clearSel();refresh()});
$('bHide').onclick=()=>{if(sel>=0){selSet.forEach(i=>boards[i].hidden=true);clearSel();refresh()}};
$('bX').onclick=()=>{xray=!xray;$('bX').classList.toggle('on',xray);refresh()};
$('bAll').onclick=()=>{boards.forEach(b=>b.hidden=false);xray=false;$('bX').classList.remove('on');refresh()};
$('ex').oninput=refresh;
$('cLab').onchange=$('cDim').onchange=refresh;
$('cFr').onchange=()=>{if($('cFr').checked&&sel>=0&&boards[sel].fr)clearSel();refresh()};
['dragenter','dragover'].forEach(t=>addEventListener(t,e=>{e.preventDefault();document.body.classList.add('drag')}));
['dragleave','drop'].forEach(t=>addEventListener(t,e=>{e.preventDefault();document.body.classList.remove('drag')}));
addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f)loadFile(f)});
</script>
